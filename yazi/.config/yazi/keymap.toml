[mgr]
prepend_keymap = [
{ on = ["o", "m"], run = "sort mtime --reverse=no", desc = "Sort by last modified time" },
{ on = ["o", "M"], run = "sort mtime --reverse=yes", desc = "Sort by last modified time (reverse)" },
{ on = ["o", "b"], run = "sort btime --reverse=no", desc = "Sort by birth time" },
{ on = ["o", "B"], run = "sort btime --reverse=yes", desc = "Sort by birth time (reverse)" },
{ on = ["o", "e"], run = "sort extension --reverse=no", desc = "Sort by extension" },
{ on = ["o", "E"], run = "sort extension --reverse=yes", desc = "Sort by extension (reverse)" },
{ on = ["o", "a"], run = "sort alphabetical --reverse=no", desc = "Sort alphabetically" },
{ on = ["o", "A"], run = "sort alphabetical --reverse=yes", desc = "Sort alphabetically (reverse)" },
{ on = ["o", "n"], run = "sort natural --reverse=no", desc = "Sort naturally" },
{ on = ["o", "N"], run = "sort natural --reverse=yes", desc = "Sort naturally (reverse)" },
{ on = ["o", "s"], run = "sort size --reverse=no", desc = "Sort by size" },
{ on = ["o", "S"], run = "sort size --reverse=yes", desc = "Sort by size (reverse)" },
{ on = ["o", "r"], run = "sort random --reverse=no", desc = "Sort randomly" },
{ on = ["o", "0"], run = "sort none --reverse=no", desc = "Do not sort" },
{ on = "<F1>", run = "help", desc = "Show keyboard shortcuts" },
{ on = "~", run = "help", desc = "Show keyboard shortcuts" },
{ on = "t", run = "tab_create", desc = "Create a new tab" },
{ on = "T", run = "plugin toggle-pane min-preview", desc = "Show or hide the preview pane" },
{ on = "<C-t>", run = "close", desc = "Close current tab" },
{ on = "<S-e>", run = "quit", desc = "quit" },
{ on = "q", run = "quit", desc = "quit" },
]
