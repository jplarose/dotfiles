# Source colors
source = colors.conf

general {
    ignore_empty_input = true
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = screenshot
    color = $surface
    blur_passes = 4
    blur_size = 8
    noise = 0.015
    contrast = 0.85
    brightness = 0.55
    vibrancy = 0.1
}

shape {
    monitor =
    size = 460, 400
    color = rgba(1e1f25dd)
    rounding = 24
    border_size = 1
    border_color = $outline_variant
    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = $primary
    font_size = 72
    font_family = Fira Sans Semibold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %B %-d'
    color = $on_surface_variant
    font_size = 18
    font_family = Fira Sans Semibold
    position = 0, 45
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = $on_surface
    font_size = 20
    font_family = Fira Sans Semibold
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 60
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    inner_color = $on_primary_container
    font_color = $on_primary
    font_family = Fira Semibold
    outer_color = $primary
    outline_thickness = 3
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = 10 # -1 means complete rounding (circle/oval)
    check_color = $primary
    fail_color = $error # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -85
    halign = center
    valign = center
    shadow_passes = 10
    shadow_size = 20
    shadow_color = $shadow
    shadow_boost = 1.6
}

auth {
    pam:enabled = true
    pam:module = hyprlock

    fingerprint:enabled = false
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Scanning fingerprint
    fingerprint:retry_delay = 250
}

label {
    monitor =
    text = <i>Enter password to unlock</i>
    color = $on_surface_variant
    font_size = 14
    font_family = Fira Sans Semibold
    position = 0, -140
    halign = center
    valign = center
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fade, 1, 1.5, easeOut
    animation = inputField, 1, 1.5, easeOut
}
